<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="static/style.css">
</head>
<body>
    
    <ul>
    {% for episode in episodes %}
    <li>
        <h2>{{ episode.id + 1 }}</h2>
        <h3>{{ episode.title }}</h3>
        <h4>{{ episode.upload_at }}</h4>
        <img src="{{ episode.thumbnail_path }}" alt="">

    </li>
    {% endfor %}
    </ul>
</body>
</html>
