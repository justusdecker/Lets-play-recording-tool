name: Audio Fix
description: Apply audio processing filters to microphone tracks within a defined episode range.
include: |
    data_access        
    ffmpeg_api          
    constants           
    ui_manager         
    core_helpers
    progress_bar

translation_table:
  - key: bin::ui::frequency_high_pass
    en: 'Frequency'
    de: 'Frequenz'
    

ui:
  
  - name: Highpass enabled
    id: highpass_enabled
    type: bool
    value: False

  - name: Highpass frequency
    id: highpass_enabled
    type: float
    value: 175.0

  - name: Filter Frame
    id: frame_audio_filters
    master: $AUTOMATION_ROOT
    pack:
      pady: 10

  - name: Highpass Frame
    id: frame_audio_filters
    master: $frame_audio_filters
    pack:
      fill: x
      padx: 5
      pady: 5

  - name: Highpass Frame
    id: frame_audio_filters
    master: $frame_audio_filters
    pack:
      fill: x
      padx: 5
      pady: 5

  - name: Activate Highpass Button
    id: frame_audio_filters
    master: $frame_audio_filters
    pack:
      fill: x
      padx: 5
      pady: 5