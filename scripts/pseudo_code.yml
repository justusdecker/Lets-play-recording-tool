name: Audio Fix
description: Apply audio processing filters to microphone tracks within a defined episode range.
include: |
    data_access        
    ffmpeg_api          
    constants           
    ui_manager         
    core_helpers        

workflow:

  steps:

    - name: Call
      call: ui_manager.test

    - name: Call with Argument
      call: data_access.cnef
      id: cwa1
      args: 
        - $argument

    - name: Call with return
      call: data_access.read_episodes
      id: cwr
      args:
        - $lpid
      output: $all_episodes

    - name: Call with multiple Arguments
      call: ui_manager.test2
      id: cma
      args:
        - 3
        - 6
      output: 
            - $ep_start
            - $ep_end

    - name: A loop
      loop:
      range: 
          - $ep_start
          - $ep_end
      as: i
      steps:
        - name: Call
          call: ui_manager.test

    - name: Check 1 Audio Path not null (reoc ERROR_013)
      check:
        expression: '$audio_mic_path == null'
      on_true:
        - call: ui_manager.test

on_error:
  exception_type: AutomationError
  steps:
    - name: Display error message
      call: ui_manager.test
      args:
        - Automation Error\n$AE_MESSAGE
