name: Runtest

on:
    push: 
        - '**'
    pull_request:
jobs:
    run-tests:
        strategy:
            fail-fast: false
            matrix:
                os: [windows-latest]
                python-version: 
                    - "3.10"
                    - "3.11"
                    - "3.12"
                    - "3.13"

        name: Test
        runs-on: ${{ matrix.os }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v3
            - name: Set up Python
              uses: actions/setup-python@v4
              with:
                python-version: ${{ matrix.python-version }}
            - name: Version File
              run: python bin/version.py
            - name: Hash File
              run: python bin/commit_hash.py